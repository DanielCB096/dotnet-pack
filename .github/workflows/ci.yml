name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PipelineKit.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build PipelineKit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PipelineKit.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack PipelineKit.slnx -c Release --no-build -o artifacts

      - name: Test dotnet new template
        run: |
          dotnet new install artifacts/PipelineKit.Templates.0.5.0.nupkg
          dotnet new pipelinekit-job -n CiTemplate -o /tmp/ci-template
          dotnet restore /tmp/ci-template/CiTemplate.csproj \
            --source "$PWD/artifacts" \
            --source "https://api.nuget.org/v3/index.json"
          dotnet run --project /tmp/ci-template/CiTemplate.csproj -c Release
          dotnet run --project /tmp/ci-template/CiTemplate.csproj -c Release | tee /tmp/ci-template-run2.txt
          grep -q "extracted=0" /tmp/ci-template-run2.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  windows-x86:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PipelineKit.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build PipelineKit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PipelineKit.slnx -c Release --no-build

      - name: Publish x86 sample
        run: dotnet publish samples/LegacyBridge/LegacyBridge.Control -c Release -r win-x86 --self-contained true -o publish-x86

      - name: Run x86 sample end to end
        shell: pwsh
        run: |
          .\publish-x86\LegacyBridge.Control.exe --reset --data "${{ github.workspace }}\ci-data"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rabbitmq-e2e:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.4.1-management
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: pipeline
          RABBITMQ_DEFAULT_PASS: pipeline
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PipelineKit.slnx --configfile NuGet.Config

      - name: Build samples
        run: |
          dotnet build samples/LegacyBridge/LegacyBridge.Control -c Release --no-restore
          dotnet build samples/LegacyBridge.Consumer -c Release --no-restore

      - name: Publish three events
        env:
          RABBITMQ_HOST: localhost
          RABBITMQ_USER: pipeline
          RABBITMQ_PASSWORD: pipeline
        run: dotnet run --project samples/LegacyBridge/LegacyBridge.Control -c Release --no-build -- --reset

      - name: Consume three events idempotently
        env:
          RABBITMQ_HOST: localhost
          RABBITMQ_USER: pipeline
          RABBITMQ_PASSWORD: pipeline
          LEGACYBRIDGE_DATA: /tmp/legacybridge-consumer
        run: |
          for i in 1 2 3; do
            dotnet run --project samples/LegacyBridge.Consumer -c Release --no-build -- --once
          done
