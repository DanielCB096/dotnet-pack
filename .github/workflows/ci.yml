name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PipelineKit.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build PipelineKit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PipelineKit.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack PipelineKit.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
