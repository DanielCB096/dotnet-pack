name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet restore PipelineKit.slnx --configfile NuGet.Config
      - run: dotnet stryker --config-file stryker-config.incremental.json
      - uses: actions/upload-artifact@v7
        with:
          name: stryker-incremental
          path: StrykerOutput/**

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet restore PipelineKit.slnx --configfile NuGet.Config
      - run: dotnet stryker --config-file stryker-config.quality.json
      - uses: actions/upload-artifact@v7
        with:
          name: stryker-quality
          path: StrykerOutput/**
