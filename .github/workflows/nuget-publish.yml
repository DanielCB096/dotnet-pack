name: nuget-publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PipelineKit.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build PipelineKit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PipelineKit.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack PipelineKit.slnx -c Release --no-build -o artifacts

      - name: NuGet login (OIDC -> temporary key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'Daniel_CB' }}

      - name: Publish packages to NuGet.org
        run: |
          for pkg in artifacts/*.nupkg; do
            case "$pkg" in
              *.snupkg) continue ;;
            esac
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done

      - name: Publish symbols to NuGet.org
        run: |
          for pkg in artifacts/*.snupkg; do
            [ -e "$pkg" ] || continue
            case "$pkg" in
              *PipelineKit.Templates*) continue ;;
            esac
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done
